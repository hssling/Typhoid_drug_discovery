# Typhoid HDT Pipeline Configuration

project:
  name: "Typhoid Host-Directed Therapy Pipeline"
  author: "Dr. Siddalingaiah H S"
  version: "1.0.0"
  date: "2024-12-31"

# Gene signature parameters
gene_signature:
  source: "Multi-GEO typhoid transcriptomic meta-analysis"
  total_genes: 50
  pathways:
    - autophagy
    - inflammasome
    - macrophage_polarization
    - iron_homeostasis
    - cytokine_signaling
    - nfkb_pathway
    - phagosome_maturation
    - oxidative_stress

# Infection phase stratification
infection_phase:
  - Acute: "Active infection (days 1-14)"
  - Carrier: "Chronic gallbladder persistence"
  - Both: "Relevant to all phases"

# Database versions
databases:
  chembl: "v33"
  opentargets: "24.09"
  mygene: "v3"

# Target prioritization weights
scoring:
  omics_strength: 0.35
  opentargets_evidence: 0.25
  druggability_proxy: 0.20
  pathway_centrality: 0.10
  replication: 0.10

# GEO datasets - VERIFIED (2026-01-19)
# Note: GSE17492, GSE22270 removed (do not exist)
# Note: GSE19491 removed (was TB data, not typhoid)
geo_datasets:
  - id: "GSE7000"
    description: "Typhoid blood transcriptomes (Thompson 2009 PNAS)"
    pmid: "20018727"
    samples: 47
    platform: "Illumina"
    verified: true
    
  - id: "GSE114192"
    description: "Typhoid human challenge model (Blohmke 2018)"
    pmid: "30232458"
    samples: 36
    platform: "Illumina RNA-seq"
    verified: true
    
  - id: "GSE30565"
    description: "S. Typhi in vivo transcription in blood"
    pmid: "22363001"
    samples: 5
    platform: "Microarray"
    verified: true
